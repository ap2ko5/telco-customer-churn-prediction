[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "telco-churn-intelligence"
version = "1.0.0"
description = "Stacked XGBoost + Neural Network churn intelligence system with Streamlit dashboard"
requires-python = ">=3.10"
readme = "README.md"

# ── pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ── ruff (linter / formatter) ──────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]   # pycodestyle, pyflakes, warnings, isort, pyupgrade, bugbear
ignore = ["E501"]                            # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]
